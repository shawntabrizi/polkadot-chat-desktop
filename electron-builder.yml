# macOS Apple Silicon package (M3). Unsigned: no code signing, notarization or
# auto-update in v1. Shape taken from .refs/polkadot-desktop/electron-builder.js.
appId: dev.shawntabrizi.polkadot-chat
productName: Polkadot Chat
directories:
  output: dist
# The bundles electron-vite builds; electron-builder adds the production
# node_modules (main keeps its dependencies external) on its own.
files:
  - out/**
  - package.json
# resources/summit-bandersnatch-cli.wasm, read by src/main/resources.ts from
# process.resourcesPath/resources in the packaged app.
extraResources:
  - from: resources
    to: resources
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.social-networking
  identity: null
  # M15b voice notes: macOS asks for the microphone with this text.
  extendInfo:
    NSMicrophoneUsageDescription: Polkadot Chat uses the microphone only while you record a voice message.
# M16b (spec 0011 ruling 9): group invite links `polkadotapp://g#…` open in
# the app; macOS only routes a scheme the bundle declares.
protocols:
  - name: Polkadot Chat invite link
    schemes:
      - polkadotapp
